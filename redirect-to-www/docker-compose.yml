services:
  redirect-to-www:
    image: nfrastack/nginx
    container_name: redirect-to-www
    environment:
      - VIRTUAL_HOST=example.com
      - HTTPS_METHOD=nohttps
      - NGINX_MODE=redirect ## provided by nfrastack/nginx
      - NGINX_REDIRECT_URL=https://www.example.com ## provided by nfrastack/nginx
networks:
  default:
    name: proxy
    external: true
